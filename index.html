                    { time: "17:00 - 18:30", title: "榮商圈 / 綠洲21", type: "spot", detail: "逛街 + 看夜景。" },
                    { time: "19:30", title: "名古屋名物晚餐", type: "food", detail: "喺榮商圈食名古屋最具代表性嘅晚餐。", highlight: true,
                      recs: [{n: "矢場町本店", t: "鐵板味噌豬排", desc: "淋上濃郁紅味噌嘅極品炸豬排"}, {n: "世界之山將", t: "夢幻手羽先", desc: "胡椒味極重嘅炸雞翼"}]
                    },
                    { time: "21:00", title: "入住東横INN名古屋栄", type: "hotel", detail: "Check-in 整理戰利品！位於榮商圈，交通非常方便。" }
                ]
            },
            {
                id: 7, date: "2026-04-21", displayDate: "4/21 (二)", title: "熱田神宮與返港", city: "名古屋 (Nagoya)", lat: 35.1815, lon: 136.9066,
                events: [
                    { time: "09:30", title: "Check-out 及移動", type: "task", detail: "離開酒店。建議將大行李帶到「名古屋站」嘅 Locker 寄放，方便晏晝直接去機場。" },
                    { time: "10:00 - 11:30", title: "熱田神宮", type: "spot", detail: "早上先去參拜神劍，享受寧靜嘅森林浴。" },
                    { time: "12:00 - 13:30", title: "極品交趾雞午餐", type: "food", detail: "返回名古屋站。用極致嘅名古屋特產「交趾雞(地雞)」畫上完美句號！", highlight: true,
                      recs: [{n: "鳥開總本家 (名駅店)", t: "交趾雞三吃", desc: "極品烤雞肉飯！同鰻魚飯一樣有三種食法"}, {n: "山本屋本店", t: "味噌燉烏冬", desc: "超濃郁紅味噌湯底，絕無海鮮"}]
                    },
                    { time: "14:00 - 16:30", title: "最後補貨 (名駅周邊)", type: "shop", detail: "Bic Camera、千里馬藥局、名鐵百貨。買完攞返行李直接搭車超方便。" },
                    { time: "16:45", title: "🚶 轉車指引：名鐵站", type: "task", detail: "從名古屋站步行至「名鐵 (Meitetsu)」車站約需 10 分鐘，別跟著 JR 走。", highlight: true },
                    { time: "17:00 - 17:30", title: "名鐵 μ-SKY 往機場", type: "transport", detail: "喺名鐵名古屋站上車。全車指定席，28分鐘直達 NGO 機場。", cost: "¥1,250" },
                    { time: "21:00", title: "起飛返港 (HKG)", type: "flight", detail: "完美結束旅程！" }
                ]
            }
        ];

        // --- UI Components ---
        const IconWrapper = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const CopyButton = ({ text, onCopy }) => (
            <button 
                onClick={(e) => { e.stopPropagation(); navigator.clipboard.writeText(text).then(onCopy); }}
                className="ml-2 inline-flex items-center gap-1 bg-zinc-800 hover:bg-sky-900/50 text-sky-400 px-2 py-1 rounded text-[10px] font-bold transition-colors border border-zinc-700"
            >
                <IconWrapper name="copy" className="w-3 h-3" /> 複製
            </button>
        );

        const WeatherWidget = ({ lat, lon, date }) => {
            const [weather, setWeather] = useState(null);
            useEffect(() => {
                const fetchWeather = async () => {
                    try {
                        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${date}&end_date=${date}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&models=best_match`);
                        const data = await res.json();
                        if (data.daily) setWeather({ 
                            code: data.daily.weather_code[0], 
                            max: Math.round(data.daily.temperature_2m_max[0]), 
                            min: Math.round(data.daily.temperature_2m_min[0]) 
                        });
                    } catch (e) { console.error(e); }
                };
                if (lat && lon) fetchWeather();
            }, [lat, lon, date]);

            if (!weather) return <div className="text-xs text-zinc-500 animate-pulse">連線中...</div>;
            return (
                <div className="flex items-center gap-1.5 bg-zinc-900/80 backdrop-blur px-3 py-1.5 rounded-full border border-zinc-800 shadow-sm">
                    <IconWrapper name={weather.code <= 3 ? "sun" : "cloud"} className="w-3.5 h-3.5 text-sky-400" />
                    <span className="font-bold text-xs text-zinc-200">{weather.max}°</span>
                    <span className="text-[10px] text-zinc-500">/{weather.min}°</span>
                </div>
            );
        };

        // --- Main Views ---
        const ItineraryView = () => {
            const [currentDayIdx, setCurrentDayIdx] = useState(0);
            const [toast, setToast] = useState('');
            const day = ITINERARY_DATA[currentDayIdx];
            const currentPlan = day.events; // 只有主線 Events
            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2000); };
            
            const handlePrevDay = () => { if (currentDayIdx > 0) setCurrentDayIdx(currentDayIdx - 1); };
            const handleNextDay = () => { if (currentDayIdx < ITINERARY_DATA.length - 1) setCurrentDayIdx(currentDayIdx + 1); };

            return (
                <div className="h-full flex flex-col pb-20">
                    {toast && <div className="toast">{toast}</div>}
                    
                    <div className="bg-black/80 backdrop-blur-md sticky top-0 z-20 border-b border-zinc-800">
                        <div className="px-4 pt-3 pb-2 flex items-center gap-2">
                            <div className="w-6 h-6 rounded bg-sky-500/20 flex items-center justify-center">
                                <IconWrapper name="map" className="text-sky-400 w-4 h-4" />
                            </div>
                            <h1 className="text-sm font-bold text-zinc-100 tracking-wide">立山黑部 終極確認版</h1>
                        </div>
                        <div className="flex overflow-x-auto no-scrollbar gap-2 px-4 pb-3 snap-x">
                            {ITINERARY_DATA.map((d, idx) => (
                                <button key={d.id} onClick={() => setCurrentDayIdx(idx)}
                                    className={`flex-shrink-0 px-4 py-1.5 rounded-lg flex flex-col items-center min-w-[60px] transition-all snap-center border ${currentDayIdx === idx ? 'bg-sky-500/10 text-sky-400 border-sky-500/50 shadow-glow-primary' : 'bg-zinc-900 border-zinc-800 text-zinc-500 hover:text-zinc-300'}`}>
                                    <span className="text-[9px] font-bold uppercase tracking-wider">Day {idx + 1}</span>
                                    <span className="text-sm font-bold">{d.date.split('-')[2]}</span>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div key={day.id} className="flex-1 px-4 py-5 overflow-y-auto pb-24 animate-card">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <div className="flex items-center gap-2 mb-1.5">
                                    <span className="text-[10px] font-bold text-zinc-900 bg-sky-400 px-2 py-0.5 rounded uppercase tracking-wider">{day.city}</span>
                                    {day.note && <span className="text-[10px] font-bold text-amber-400 border border-amber-400/30 px-2 py-0.5 rounded bg-amber-400/10">{day.note}</span>}
                                </div>
                                <h2 className="text-2xl font-bold text-zinc-50">{day.title}</h2>
                                <p className="text-xs text-zinc-400 mt-1 font-mono">{day.date.replace(/-/g, '/')} {day.displayDate.split(' ')[1]}</p>
                            </div>
                            <WeatherWidget lat={day.lat} lon={day.lon} date={day.date} />
                        </div>

                        <div className="space-y-4 relative pl-[14px]">
                            <div className="absolute left-[27px] top-4 bottom-4 w-[2px] bg-zinc-800 rounded-full"></div>
                            {currentPlan.map((item, i) => (
                                <div key={i} className="relative pl-8">
                                    <div className={`absolute left-[-14px] top-0 w-8 h-8 rounded-full flex items-center justify-center z-10 border-[3px] border-[#09090b] ${
                                        item.type === 'task' || item.type === 'luggage' ? 'bg-sky-500 text-zinc-950' :
                                        item.type === 'alert' ? 'bg-red-500 text-white' :
                                        item.type === 'festival' ? 'bg-amber-400 text-zinc-950' :
                                        item.type === 'food' ? 'bg-orange-500 text-white' :
                                        item.highlight ? 'bg-zinc-200 text-zinc-900' : 'bg-zinc-800 text-zinc-400'
                                    }`}>
                                        <IconWrapper name={
                                            item.type === 'luggage' ? 'package-check' :
                                            item.type === 'task' ? 'clipboard-list' :
                                            item.type === 'alert' ? 'triangle-alert' :
                                            item.type === 'festival' ? 'flame' :
                                            item.type === 'transport' ? 'train-front' : 
                                            item.type === 'food' ? 'utensils' : 
                                            item.type === 'shop' ? 'shopping-bag' : 
                                            item.type === 'hotel' ? 'bed' : 'map-pin'
                                        } className="w-3.5 h-3.5" />
                                    </div>

                                    <div className={`app-card p-4 ${item.type === 'task' || item.type === 'luggage' ? 'task-box' : item.type === 'alert' ? 'alert-box' : item.type === 'festival' ? 'festival-box' : item.type === 'food' ? 'food-box' : ''}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <span className={`text-[11px] font-bold font-mono px-1.5 py-0.5 rounded ${
                                                item.type === 'alert' ? 'bg-red-500/20 text-red-400' :
                                                item.type === 'task' || item.type === 'luggage' ? 'bg-sky-500/20 text-sky-400' :
                                                item.type === 'food' ? 'bg-orange-500/20 text-orange-400' :
                                                'bg-zinc-800 text-zinc-400'
                                            }`}>{item.time.split(' - ')[0]}</span>
                                            
                                            {item.type !== 'task' && item.type !== 'luggage' && item.type !== 'alert' && item.type !== 'flight' && (
                                                <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.title + ' ' + day.city)}`} target="_blank" className="bg-zinc-800/80 p-1.5 rounded-lg border border-zinc-700 text-sky-400 hover:bg-sky-500/20 transition-colors">
                                                    <IconWrapper name="map" className="w-4 h-4" />
                                                </a>
                                            )}
                                        </div>
                                        
                                        <h3 className={`text-base font-bold mb-1.5 leading-snug ${
                                            item.type === 'alert' ? 'text-red-400' :
                                            item.type === 'festival' ? 'text-amber-400' :
                                            item.type === 'food' ? 'text-orange-400' :
                                            item.highlight ? 'text-sky-300' : 'text-zinc-100'
                                        }`}>{item.title}</h3>
                                        
                                        <div className="text-sm text-zinc-400 leading-relaxed whitespace-pre-line">{item.detail}</div>

                                        {item.recs && (
                                            <div className="mt-3 space-y-2 border-t border-zinc-800 pt-3">
                                                <div className="text-[10px] font-bold text-zinc-500 flex items-center gap-1 mb-1"><IconWrapper name="sparkles" className="w-3 h-3 text-orange-400" /> 防海鮮美食推薦</div>
                                                {item.recs.map((rec, rIdx) => (
                                                    <div key={rIdx} className="bg-black/30 p-2 rounded-lg border border-zinc-800/50 flex justify-between items-center group hover:border-orange-500/30 transition-colors">
                                                        <div><div className="font-bold text-xs text-zinc-200">{rec.n}</div><div className="text-[10px] text-zinc-500 line-clamp-1">{rec.t} · {rec.desc}</div></div>
                                                        <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(rec.n + ' ' + day.city)}`} target="_blank" className="text-zinc-600 group-hover:text-orange-400 pl-2"><IconWrapper name="navigation" className="w-4 h-4" /></a>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {item.address && <div className="mt-3 bg-black/40 p-2 rounded border border-zinc-800 flex justify-between items-center"><span className="text-xs text-zinc-500 font-mono truncate">{item.address}</span><CopyButton text={item.address} onCopy={() => showToast('地址已複製！')} /></div>}
                                        {item.cost && <div className="mt-3 inline-flex items-center gap-1.5 bg-emerald-500/10 px-2 py-1 rounded text-[11px] font-bold text-emerald-400 border border-emerald-500/20"><IconWrapper name="banknote" className="w-3 h-3" /> {item.cost}</div>}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex justify-between mt-8">
                             <button onClick={handlePrevDay} disabled={currentDayIdx===0} className="px-4 py-2 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-400 disabled:opacity-30 disabled:border-transparent text-sm font-bold shadow-sm hover:bg-zinc-800">← 前一天</button>
                             <button onClick={handleNextDay} disabled={currentDayIdx===ITINERARY_DATA.length-1} className="px-4 py-2 rounded-lg bg-sky-500 text-zinc-950 disabled:opacity-50 text-sm font-bold shadow-glow-primary hover:bg-sky-400">下一天 →</button>
                        </div>
                    </div>
                </div>
            );
        };

        const CouponView = () => {
            const [filter, setFilter] = useState("ALL");
            const [selectedCoupon, setSelectedCoupon] = useState(null);
            return (
                <div className="h-full overflow-y-auto pb-24 px-4 py-6">
                     <header className="mb-6"><h2 className="text-2xl font-bold text-zinc-50 mb-4 px-2">優惠券</h2>
                        <div className="flex gap-2 overflow-x-auto no-scrollbar px-2">
                            {['ALL', '藥妝', '百貨', '電器', '免稅店', '運動', '機場', '雜貨'].map(tag => (
                                <button key={tag} onClick={() => setFilter(tag)} className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all border ${filter === tag ? 'bg-sky-500 text-zinc-950 border-sky-400 shadow-glow-primary' : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:bg-zinc-800'}`}>{tag}</button>
                            ))}
                        </div>
                    </header>
                    <div className="grid grid-cols-2 gap-3 px-2">
                        {COUPONS_DATA.filter(c => filter === 'ALL' || c.tags.includes(filter)).map((coupon, idx) => (
                            <div key={idx} onClick={() => setSelectedCoupon(coupon)} className="app-card flex flex-col p-4 cursor-pointer group h-[110px] justify-between hover:border-sky-500/50 transition-colors">
                                <div><div className="text-[9px] font-bold text-sky-400 bg-sky-900/30 px-1.5 py-0.5 rounded uppercase w-fit mb-1">{coupon.tags[0]}</div>
                                <h3 className="font-bold text-zinc-100 text-base leading-tight truncate">{coupon.name}</h3></div>
                                <div className="text-emerald-400 font-bold text-[11px] mt-1 truncate">{coupon.discount}</div>
                            </div>
                        ))}
                    </div>
                    {selectedCoupon && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" onClick={() => setSelectedCoupon(null)}>
                            <div className="bg-zinc-900 rounded-2xl w-full max-w-sm overflow-hidden border border-zinc-700" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-zinc-800 flex justify-between bg-zinc-950"><h3 className="font-bold text-zinc-100 text-lg">{selectedCoupon.name}</h3><button onClick={() => setSelectedCoupon(null)} className="p-1.5 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-400"><IconWrapper name="x" className="w-4 h-4" /></button></div>
                                <div className="p-4 bg-white min-h-[200px] flex items-center justify-center"><img src={selectedCoupon.final_url} className="max-w-full h-auto object-contain max-h-[50vh]" /></div>
                                <div className="p-5 flex flex-col items-center bg-zinc-950"><p className="text-emerald-400 font-bold text-xl mb-1 text-center">{selectedCoupon.discount}</p><p className="text-sm text-zinc-400 mb-5">期限：{selectedCoupon.expiry}</p><a href={selectedCoupon.final_url} target="_blank" className="w-full py-3 rounded-xl bg-sky-500 text-zinc-950 font-bold text-base text-center">儲存圖片 / 開啟大圖</a></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const App = () => {
            const [tab, setTab] = useState('itinerary');
            return (
                <div className="h-[100dvh] flex flex-col bg-[#09090b]">
                    <div className="flex-1 overflow-hidden relative">
                        {tab === 'itinerary' && <ItineraryView />}
                        {tab === 'coupons' && <CouponView />}
                    </div>
                    <nav className="bg-[#18181b]/90 backdrop-blur-lg border-t border-zinc-800 pb-safe z-50">
                        <div className="flex justify-around items-center h-16 max-w-md mx-auto px-2">
                            {[{ id: 'itinerary', icon: 'map', label: '行軍圖' }, { id: 'coupons', icon: 'ticket', label: '優惠' }].map(item => (
                                <button key={item.id} onClick={() => setTab(item.id)} className={`flex flex-col items-center gap-1 w-20 transition-all ${tab === item.id ? 'text-sky-400 scale-105' : 'text-zinc-500 hover:text-zinc-400'}`}>
                                    <IconWrapper name={item.icon} className={`w-5 h-5 ${tab === item.id ? 'stroke-[2.5px]' : 'stroke-[2px]'}`} />
                                    <span className="text-[10px] font-bold">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </nav>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
